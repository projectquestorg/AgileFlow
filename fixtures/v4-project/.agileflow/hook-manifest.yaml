# Auto-generated by `agileflow setup` / `agileflow update`.
# Do not edit by hand — your changes will be overwritten on the next install.
# To override per-hook settings (timeout, skipOnError, enabled),
# use the `hooks:` map in agileflow.config.json instead.
#
version: 1
hooks:
  - id: context-loader
    event: SessionStart
    script: .agileflow/plugins/core/hooks/context-loader.js
    timeout: 5000
    skipOnError: true
  - id: preferences-injector
    event: SessionStart
    script: .agileflow/plugins/core/hooks/preferences-injector.js
    runAfter:
      - context-loader
    timeout: 2000
    skipOnError: true
  - id: damage-control-bash
    event: PreToolUse
    script: .agileflow/plugins/core/hooks/damage-control-bash.js
    matcher: Bash
    timeout: 3000
    skipOnError: false
  - id: damage-control-edit
    event: PreToolUse
    script: .agileflow/plugins/core/hooks/damage-control-edit.js
    matcher: Edit
    timeout: 3000
    skipOnError: false
  - id: damage-control-write
    event: PreToolUse
    script: .agileflow/plugins/core/hooks/damage-control-write.js
    matcher: Write
    timeout: 3000
    skipOnError: false
  - id: post-compact-state
    event: PostCompact
    script: .agileflow/plugins/core/hooks/post-compact-state.js
    timeout: 5000
    skipOnError: true
