# AgileFlow project configuration: which skills this repository uses.
# Edit freely, then run `agileflow update` (new versions) or `agileflow sync`.
version: 1
skills:
  babysitting-pr:
    source: "@agileflow/babysitting-pr"
    version: ^1.1.0
  checking-blast-radius:
    source: "@agileflow/checking-blast-radius"
    version: ^1.0.0
  diagnosing-bugs:
    source: "@agileflow/diagnosing-bugs"
    version: ^1.0.1
  filing-pr:
    source: "@agileflow/filing-pr"
    version: ^1.1.0
  interviewing-requirements:
    source: "@agileflow/interviewing-requirements"
    version: ^1.0.1
  reviewing-changes:
    source: "@agileflow/reviewing-changes"
    version: ^1.0.0
  verifying-changes:
    source: "@agileflow/verifying-changes"
    version: ^1.0.0
providers:
  claude:
    enabled: auto
  codex:
    enabled: auto
    structuredQuestions: inherit
interaction:
  questionPreference: provider-default
