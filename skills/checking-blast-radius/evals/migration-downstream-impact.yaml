name: migration-downstream-impact
skill: checking-blast-radius
fixture: monorepo
setup: |
  git checkout -q -b orders-customer-required
  cat > packages/api/migrations/002_orders_customer_required.sql <<'SQL'
  ALTER TABLE orders ALTER COLUMN customer_id SET NOT NULL;
  SQL
  git add -A
  git commit -qm 'feat(api): require a customer on every order'
prompt: |
  Before I merge this migration that makes orders.customer_id NOT NULL,
  check the downstream impact.
invocation: implicit
assert:
  shouldActivate: true
rubric:
  - checks whether existing rows or writers can produce a null customer_id (001 created the column as nullable)
  - finds the writers that insert orders without a customer (createGuestOrder in packages/api/src/orders.ts and the legacy import script's empty customer column)
  - notices consumers in other packages that rely on null customers (the Order contract and packages/web/src/order-summary.ts)
  - reports concrete evidence with file paths rather than restating the migration's intent, labeled verified or inferred
  - lists remaining risks and how to check them (for example querying production for null customer_id rows before migrating)
