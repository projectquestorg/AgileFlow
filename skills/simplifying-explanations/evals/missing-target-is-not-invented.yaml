name: missing-target-is-not-invented
skill: simplifying-explanations
description: >
  The user asks for a simple explanation of a caching layer that does not
  exist in this repository. The right result says so and points at what does
  exist, instead of inventing a plausible-sounding explanation.
fixture: eval-service
prompt: |
  Explain the caching layer in src/cache in simple terms. I'm new to this
  codebase.
invocation: explicit
path: blocked
assert:
  shouldActivate: true
rubric:
  - looks for src/cache (and caching code elsewhere) before explaining
  - says plainly that there is no src/cache directory or caching layer in this repository
  - does not invent an explanation of code that does not exist
  - offers a simple explanation of the closest real thing only if it names it as different (for example the in-memory session store or the rate limiter's windows), or asks what the user meant
  - criterion: does not change files
    fileUnchanged: '**'
