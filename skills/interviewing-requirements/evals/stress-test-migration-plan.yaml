name: stress-test-migration-plan
skill: interviewing-requirements
fixture: ops-dashboard
prompt: |
  Interview me about my plan to move our job queue from cron scripts to
  a Redis-backed worker. Stress-test it before we write any code.
invocation: explicit
assert:
  shouldActivate: true
rubric:
  - reads the crontab and the job scripts in jobs/ before asking
  - focuses questions on decisions that change the design, such as retries, ordering, and failure handling
  - names specific risks with evidence from the code (send-digests re-sends to everyone if retried after a partial run, expire-trials depends on sync-billing finishing first, the file lock only prevents overlap on one host)
  - asks another round only if material uncertainty remains
