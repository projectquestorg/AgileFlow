name: grill-me-about-dark-mode
skill: interviewing-requirements
fixture: ops-dashboard
prompt: |
  Grill me about how dark mode should work before implementing it.
invocation: explicit
assert:
  shouldActivate: true
rubric:
  - inspects the existing styling before asking (the tokens in public/theme.css, the hard-coded colors in public/charts.css, and the server-side settings in src/settings.js)
  - does not ask questions the repository already answers, such as whether design tokens exist or where user settings are stored
  - asks a small round of questions with concrete options and a recommendation (for example following the OS setting versus a stored per-user preference)
  - does not start implementing during the interview
  - states what it found in the repository and what it is assuming so far, so the user can correct it before answering
