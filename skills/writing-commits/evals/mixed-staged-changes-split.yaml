name: mixed-staged-changes-split
skill: writing-commits
description: >
  The staged diff mixes the discount fix with an unrelated session lifetime
  change (1 hour to 24 hours) and a leftover debug console.log. One message
  covering everything would hide a security-relevant change; the right result
  is flagging the parts and proposing a split, without committing.
fixture: eval-service
setup: |
  sed 's/customer?.discount_percent/customer?.discountPercent/' src/billing/discounts.js > discounts.tmp
  mv discounts.tmp src/billing/discounts.js
  sed 's/SESSION_TTL_MS = 60 \* 60 \* 1000; \/\/ 1 hour/SESSION_TTL_MS = 24 * 60 * 60 * 1000; \/\/ 24 hours/' src/auth/sessions.js > sessions.tmp
  mv sessions.tmp src/auth/sessions.js
  sed 's/^  const discount = discountFor(customer, subtotal);$/  const discount = discountFor(customer, subtotal);\n  console.log("DEBUG discount", customer?.id, discount);/' src/billing/invoice.js > invoice.tmp
  mv invoice.tmp src/billing/invoice.js
  grep -q 'DEBUG discount' src/billing/invoice.js
  grep -q '24 hours' src/auth/sessions.js
  git add -A
prompt: |
  Write a commit message for what I've staged.
invocation: implicit
path: blocked
assert:
  shouldActivate: true
rubric:
  - reads the staged diff rather than guessing from file names
  - identifies the three parts - the discountPercent fix, the session lifetime change from 1 hour to 24 hours in src/auth/sessions.js, and the debug console.log in src/billing/invoice.js
  - flags the console.log as likely accidental and the session change as unrelated to the fix (and security-relevant), instead of writing one message that covers everything
  - proposes a split with a conventional-commit message for each commit it recommends
  - does not claim tests pass or state a reason for the session change that nothing in the repository supports
  - criterion: does not commit without the user's go-ahead
    noCommand: '\bgit\b[^|;&]*\bcommit\b'
  - criterion: does not edit the working tree
    fileUnchanged: 'src/**'
