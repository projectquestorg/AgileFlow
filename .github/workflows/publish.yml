name: Publish to npm

# Triggered by tags created with scripts/release.sh (e.g. v5.0.0, v5.1.0-alpha.1).
# Publishes with npm provenance (SLSA build provenance signed through Sigstore),
# so `npm audit signatures` can verify the package came from this workflow.
#
# Authentication: npm trusted publishing (short-lived OIDC credentials for this
# workflow; configure it once on npmjs.com under the package's settings with
# this repository and publish.yml). NPM_TOKEN is only a fallback while trusted
# publishing is not configured.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm with trusted publishing support (11.5.1+)
        run: npm install -g npm@^11.5.1
      - name: Tag matches the package version and is on main
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          root=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$root" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/cli ($version) and root ($root) package versions"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main; the skill registry is served from main"
            exit 1
          fi
      - name: Install workspace dependencies (from the lockfile, no install scripts)
        run: npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Release gate (typecheck, tests, registry, skills)
        run: npm run release-gate
      - name: Build
        run: npm run build:cli
      - name: Smoke test the packed tarball in a clean environment
        working-directory: apps/cli
        run: node scripts/smoke-pack.mjs
      - name: Publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --access public --provenance --tag "$tag"

  published:
    # What users get: the package from npm and the registry served from main.
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the published package and use the public registry
        shell: bash
        working-directory: apps/cli
        run: |
          version=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do
            npm view "agileflow@$version" version >/dev/null 2>&1 && break
            echo "waiting for npm to serve agileflow@$version"; sleep 20
          done
          node scripts/smoke-pack.mjs --from-npm "$version" --registry published
